name: FireCam checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm --prefix showcase ci
      - run: npm run check
      - run: npm test
      - run: npm --prefix showcase run build
      - run: npm run test:pages
